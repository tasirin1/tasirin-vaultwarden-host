app:
  - changed-files:
      - any-glob-to-any-file:
          - app/src/main/**
          - app/build.gradle.kts
          - app/proguard-rules.pro
          - app/src/test/**
          - build.gradle.kts
          - settings.gradle.kts
          - gradle.properties

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**
          - .github/dependabot.yml
          - .github/labeler.yml
          - .github/CODEOWNERS
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md
          - tools/**
          - scripts/**
          - shim/**
          - gradle/**
          - gradlew
          - gradlew.bat
          - .editorconfig
          - .gitignore

docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - README.id.md
          - README.ru.md
          - CHANGELOG.md
          - AGENTS.md
          - "*.md"
          - LICENSE
          - LICENSE.vaultwarden
