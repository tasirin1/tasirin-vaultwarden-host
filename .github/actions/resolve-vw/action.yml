name: Resolve versi Vaultwarden terbaru

description: Ambil tag rilis Vaultwarden terbaru dari dani-garcia/vaultwarden dan validasi bentuknya.

outputs:
  tag:
    description: Versi Vaultwarden terbaru ternormalisasi (satu awalan v/V dibuang)
    value: ${{ steps.vw.outputs.tag }}
  tag_mentah:
    description: Tag rilis persis seperti diterbitkan upstream (untuk clone dan URL mentah)
    value: ${{ steps.vw.outputs.tag_mentah }}

runs:
  using: composite
  steps:
    - id: vw
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        HDR=()
        if [ -n "${GH_TOKEN:-}" ]; then HDR=(-H "Authorization: Bearer ${GH_TOKEN}"); fi
        # Audit 1361: dulu cadangan curl hanya berjalan bila gh keluar
        # non-nol; gh yang berhasil tetapi menjawab kosong membuat TAG
        # kosong dan langkah langsung gagal tanpa ulang. Kini seluruh
        # pengambilan dicoba ulang dan kekosongan juga jatuh ke curl.
        TAG=""
        for PERCOBAAN in 1 2 3 4; do
          TAG=$(gh api repos/dani-garcia/vaultwarden/releases/latest --jq '.tag_name // empty' 2>/dev/null || true)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG=$(curl -sf --retry 3 --retry-delay 5 "${HDR[@]}" https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r '.tag_name // empty' 2>/dev/null || true)
          fi
          case "$TAG" in ""|null) TAG=""; echo "Percobaan $PERCOBAAN ambil versi Vaultwarden belum berhasil; mencoba lagi..."; sleep 5;; *) break;; esac
        done
        case "$TAG" in ""|null) echo "Gagal ambil versi Vaultwarden terbaru"; exit 1;; esac

        NORM="${TAG#[vV]}"
        if ! printf '%s' "$NORM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
          echo "::error::Tag Vaultwarden tidak valid: $TAG"; exit 1
        fi
        echo "Latest Vaultwarden: $NORM (tag upstream: $TAG)"
        echo "tag=$NORM" >> "$GITHUB_OUTPUT"
        echo "tag_mentah=$TAG" >> "$GITHUB_OUTPUT"
