name: Gitleaks (deteksi secret)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '.gitignore'
  # Audit 1118: build-binary.yml TIDAK lagi dikecualikan —
  # paths-ignore menonaktifkan pindaian bila SEMUA berkas berubah
  # cocok, jadi perubahan tunggal pada workflow terbesar itu (skrip
  # inline terpanjang: heredoc patch, URL, hash) dulu lolos tanpa
  # dipindai secret sama sekali.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan secret
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
