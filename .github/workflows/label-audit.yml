name: Label audit otomatis

# Issue temuan audit membawa penanda baku di badannya: baris yang diawali
# "**Ronde audit:** putaran-N" (format laporan audit). stale.yml
# mengecualikan label `audit`; workflow ini yang memastikan label itu
# terpasang otomatis, bukan bergantung pada ingatan pembuat issue
# (temuan Audit 557 / sisa kerapuhan #245). Penanda kini BERJANGKAR pada
# format baku itu — frasa "Ronde audit" yang lepas di tengah kalimat
# (kutipan/diskusi) tidak lagi memberi label, dan label DICABUT bila
# penanda hilang dari badan sesudah suntingan (Audit 625). Label hanya
# dipasang untuk issue berpenulis pihak repo (OWNER/MEMBER/COLLABORATOR):
# penanda yang disalin pembuka issue eksternal tidak lagi membuat
# issuenya kebal-stale lewat pengecualian label audit (Audit 751).

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    name: Pasang label audit dari penanda badan issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Samakan label audit dengan penanda baku di badan issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BADAN: ${{ github.event.issue.body }}
          NOMOR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ASOSIASI: ${{ github.event.issue.author_association }}
        run: |
          dipercaya=0
          case ",$ASOSIASI," in
            *,OWNER,*|*,MEMBER,*|*,COLLABORATOR,*) dipercaya=1 ;;
          esac
          if [ "$dipercaya" = 1 ] && printf '%s' "$BADAN" | grep -qE '^\*\*Ronde audit:\*\* putaran-[0-9]+'; then
            gh issue edit "$NOMOR" --repo "$REPO" --add-label audit
          elif printf ',%s,' "$LABELS" | grep -q ',audit,'; then
            gh issue edit "$NOMOR" --repo "$REPO" --remove-label audit
            echo "Penanda baku tak ada atau penulis bukan pihak repo; label audit dicabut."
          else
            echo "Tak ada penanda ronde audit dari penulis pihak repo; label tak diubah."
          fi
