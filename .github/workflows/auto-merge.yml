name: Auto-merge dependabot

on:
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge PR Dependabot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: auto-merge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Deteksi perubahan dependensi Gradle
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! FILES=$(gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json files --jq '.files[].path'); then
            echo "::error::Gagal membaca daftar file PR - auto-merge dibatalkan."
            exit 1
          fi
          if [ -z "$FILES" ]; then
            echo "::error::Daftar file PR kosong - auto-merge dibatalkan."
            exit 1
          fi
          echo "File berubah di PR:"
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(app/build\.gradle\.kts|build\.gradle\.kts|gradle/|gradle\.properties|settings\.gradle\.kts)'; then
            echo "GRADLE_DEPS=true" >> "$GITHUB_ENV"
          fi
          if echo "$FILES" | grep -qE '^(\.github/workflows/build-binary\.yml|shim/)'; then
            echo "BINARY_PR=true" >> "$GITHUB_ENV"
          fi

      - name: Matikan auto-merge bila kini menyentuh dependensi Gradle
        if: env.GRADLE_DEPS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --disable-auto-merge || echo "Auto-merge memang belum aktif di PR ini."

      - name: Komentar panduan (PR dependensi Gradle)
        if: env.GRADLE_DEPS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} --body "PR ini mengubah dependensi Gradle. Sesuai aturan repo, perubahan dependensi ditangani manual: pastikan gerbang Verifikasi Patch dan build CI hijau dulu, lalu merge manual."

      - name: Matikan auto-merge bila menyentuh workflow binary atau shim
        if: env.BINARY_PR == 'true' && env.GRADLE_DEPS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --disable-auto-merge || echo "Auto-merge memang belum aktif di PR ini."

      - name: Komentar panduan (PR workflow binary/shim)
        if: env.BINARY_PR == 'true' && env.GRADLE_DEPS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} --body "PR ini menyentuh workflow Build Binary atau shim. Perubahan itu hanya teruji oleh workflow Build Binary (15-120 menit) yang tidak bisa ditunggu auto-merge, jadi PR ditangani manual: pastikan run Build Binary untuk head PR ini hijau dulu, lalu merge manual."

      - name: Pastikan cek wajib muncul di PR ini
        if: env.GRADLE_DEPS != 'true' && env.BINARY_PR != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            CHECKS=$(gh pr checks ${{ github.event.pull_request.number }} -R ${{ github.repository }} 2>/dev/null || true)
            if printf '%s' "$CHECKS" | grep -q 'Cek patch yang berubah'; then
              echo "Cek wajib 'Cek patch yang berubah' terdaftar di PR ini."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Cek wajib 'Cek patch yang berubah' tak muncul di PR ini - auto-merge dibatalkan (proteksi branch mungkin berubah)."
          exit 1

      - name: Tunggu hasil Build APK untuk head PR ini (bila ada)
        if: env.GRADLE_DEPS != 'true' && env.BINARY_PR != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          RUN_ID=""
          for i in 1 2 3 4 5 6 7 8; do
            RUN_ID=$(gh run list -R ${{ github.repository }} --workflow build-apk.yml --commit "$SHA" --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            sleep 15
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Tak ada run Build APK untuk head ini (PR tersaring path) - lanjut hanya dengan cek wajib."
            exit 0
          fi
          echo "Menunggu run Build APK $RUN_ID selesai..."
          for i in $(seq 1 36); do
            BARIS=$(gh run view "$RUN_ID" -R ${{ github.repository }} --json status,conclusion --jq '[.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)
            STATUS=$(printf '%s' "$BARIS" | cut -f1)
            CONCL=$(printf '%s' "$BARIS" | cut -f2)
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCL" = "success" ]; then
                echo "Build APK hijau untuk head ini."
                exit 0
              fi
              echo "::error::Build APK berakhir '$CONCL' - auto-merge dibatalkan."
              exit 1
            fi
            sleep 20
          done
          echo "::error::Build APK belum selesai dalam batas tunggu - auto-merge dibatalkan."
          exit 1

      - name: Pastikan head PR belum berganti sejak divalidasi
        if: env.GRADLE_DEPS != 'true' && env.BINARY_PR != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_KINI=$(gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json headRefOid --jq '.headRefOid')
          if [ "$HEAD_KINI" != "${{ github.event.pull_request.head.sha }}" ]; then
            echo "::error::Head PR berganti ($HEAD_KINI) sejak Build APK divalidasi (${{ github.event.pull_request.head.sha }}) - auto-merge dibatalkan; run untuk head baru yang menilai ulang."
            exit 1
          fi
          echo "Head PR tetap $HEAD_KINI."

      - name: Auto-merge sesudah build dan cek wajib hijau (bukan dependensi Gradle)
        if: env.GRADLE_DEPS != 'true' && env.BINARY_PR != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} -R ${{ github.repository }} --merge --auto
