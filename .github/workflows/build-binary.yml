name: Build Binary & Web-Vault

on:
  push:
    branches: [ main ]
    # Hanya jalur berat yang memicu workflow ini (patch workflow/shim).
    # Perbaikan aplikasi (app/**) TIDAK ikut membangun ulang binary (~15 mnt).
    paths:
      - '.github/workflows/build-binary.yml'
      - 'shim/**'
  workflow_dispatch:
  # Cek bulanan tiap tanggal 1: hanya bangun bila keenam aset non-APK untuk
  # tag upstream terbaru belum lengkap; resolve mengisi skip=yes bila sudah.
  schedule:
    - cron: '0 0 1 * *'

# Default minimal: hanya baca. Hanya publish-binary yang memegang contents:
# write (buat rilis + unggah aset); build-binary tak perlu akses tulis.
permissions:
  contents: read

# Grup sendiri agar bisa jalan paralel dengan workflow APK (unggahan asset
# ke rilis yang sama aman: gh release upload --clobber menimpa nama yang sama).
concurrency:
  group: vw-binary
  cancel-in-progress: false

env:
  NDK_VERSION: 25.2.9519653

jobs:
  verifikasi:
    name: Cek patch yang berubah
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Token tak disimpan di .git/config: langkah berikutnya tak butuh push.
          persist-credentials: false
      - name: Verifikasi patch (tanpa SDK Android)
        run: |
          # Gagal di sini = job build tidak jalan.
          python3 tools/verifikasi-patch.py --rentang "${{ github.event.before }}...${{ github.sha }}"
      - name: Cek cepat (vektor 0.x, ID land, README, secret)
        run: bash scripts/cek-cepat.sh

  resolve:
    name: Resolve latest Vaultwarden
    runs-on: ubuntu-24.04
    outputs:
      vw: ${{ steps.vw.outputs.tag }}
      skip: ${{ steps.vw.outputs.skip }}
    steps:
      - id: vw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fallback curl membawa token (limit 5000/jam, bukan 60/jam anonim)
          # agar resolve tak gagal spurios saat cron + push berdekatan.
          HDR=()
          if [ -n "${GH_TOKEN:-}" ]; then HDR=(-H "Authorization: Bearer ${GH_TOKEN}"); fi
          TAG=$(gh api repos/dani-garcia/vaultwarden/releases/latest --jq '.tag_name // empty' 2>/dev/null \
            || curl -sf --retry 3 --retry-delay 5 "${HDR[@]}" https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r '.tag_name // empty')
          case "$TAG" in ""|null) echo "Gagal ambil versi Vaultwarden terbaru"; exit 1;; esac
          # Tag upstream = data eksternal: wajib berbentuk versi rilis sebelum
          # dipakai di env/run. Tanpa ini tag berisi $(...) / backtick dieksekusi
          # shell runner (runner memegang GITHUB_TOKEN walau job ini baca).
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag Vaultwarden tidak valid: $TAG"; exit 1
          fi
          echo "Latest Vaultwarden: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Repo TIDAK boleh di-hardcode: dulu tertulis tasirin1/... sehingga
          # fork/rename repo melihat EXISTING kosong -> cek "sudah ada" meleset,
          # build binary ~15 mnt jalan terus tiap cron padahal asetnya ada.
          # Skip cron HANYA bila keenam aset non-APK sudah ada: tag rilis bisa
          # dibuat workflow APK lebih dulu (hanya berisi APK), dan dulu
          # keberadaan tag saja sudah membuat cron bulanan skip selamanya —
          # binary/web-vault untuk versi itu tak pernah terbit.
          # Daftar aset dibaca dengan coba-ulang: `gh` bisa gagal sesaat
          # (502/rate-limit/timeout). Dulu `|| true` membuat DAFTAR kosong
          # sehingga cron menyimpulkan "aset belum lengkap" lalu membangun
          # ulang binary ~15 mnt padahal asetnya ada. Kini galat sesaat
          # dibedakan dari rilis yang memang belum ada (404 = perlu build).
          DAFTAR=""
          TERBACA=no
          for coba in 1 2 3 4; do
            if KELUAR=$(gh release view "v$TAG" --json assets -q '.assets[].name' 2>&1); then
              DAFTAR="$KELUAR"
              TERBACA=yes
              break
            fi
            case "$KELUAR" in
              *"not found"*|*"Not Found"*|*"HTTP 404"*)
                # Rilis belum ada: memang belum lengkap, build perlu jalan.
                DAFTAR=""
                TERBACA=yes
                break
                ;;
            esac
            if [ "$coba" -lt 4 ]; then
              echo "::warning::Gagal membaca daftar aset rilis v$TAG (coba $coba/4); ulangi 5 dtk."
              sleep 5
            fi
          done
          if [ "$TERBACA" != yes ]; then
            # Tanpa daftar aset, "belum lengkap" bukan kesimpulan yang sah:
            # gagalkan resolve agar cron tak membangun ulang tanpa alasan.
            echo "::error::Daftar aset rilis v$TAG tak terbaca (bukan bukti aset hilang)."
            exit 1
          fi
          LENGKAP=yes
          for a in vaultwarden-armeabi-v7a vaultwarden-armeabi-v7a.sha256 \
              libgetrandom-shim-armeabi-v7a.so libgetrandom-shim-armeabi-v7a.so.sha256 \
              web-vault.zip web-vault.zip.sha256; do
            # grep TANPA -q: dengan -q ia keluar di kecocokan pertama, printf
            # kena SIGPIPE (141) dan pipefail membuat LENGKAP=no palsu.
            printf '%s\n' "$DAFTAR" | grep -x "$a" >/dev/null || LENGKAP=no
          done
          echo "Aset non-APK v$TAG lengkap: $LENGKAP"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LENGKAP" = yes ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          fi

  build-binary:
    name: Build binary + shim (armeabi-v7a)
    needs: [resolve, verifikasi]
    # Satu job untuk binary Rust (~15 mnt) + shim (detik) agar NDK (~500 MB)
    # cukup diunduh sekali. Push ke workflow ini sudah difilter paths.
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-24.04
    env:
      VW: ${{ needs.resolve.outputs.vw }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install rustup (tanpa toolchain)
        run: |
          # Hanya rustup-nya (~10 MB); toolchain yang diunduh cukup SATU:
          # versi pinned Vaultwarden (langkah khusus di bawah). Menghemat
          # satu unduhan toolchain stable yang tak dipakai.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Fetch Vaultwarden source (${{ needs.resolve.outputs.vw }})
        run: |
          git clone --depth 1 --branch "$VW" \
            https://github.com/dani-garcia/vaultwarden.git

      - name: Unduh bundel CA Mozilla (verifier TLS Android)
        run: |
          # Kunci integritas bundel root Mozilla: isi cacert.pem di curl.se
          # berubah saat Mozilla memperbarui root, dan tanpa pin file yang
          # berubah/diretas ikut masuk binary. Bila curl.se merilis bundel
          # baru, langkah ini GAGAL dengan sengaja — periksa perubahan lalu
          # perbarui hash (curl -s https://curl.se/ca/cacert.pem | sha256sum).
          CACERT_SHA256="796f1389bfea13c0ed78f663b765baaff54a508e5483786bd6ece73c5e3e3cbe"
          curl -fsSL --retry 3 https://curl.se/ca/cacert.pem \
            -o vaultwarden/mozilla-cacert.pem
          echo "$CACERT_SHA256  vaultwarden/mozilla-cacert.pem" | sha256sum -c -
          grep -q "BEGIN CERTIFICATE" vaultwarden/mozilla-cacert.pem

      - name: Patch DNS resolver untuk Android (tanpa ndk-context)
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'vaultwarden/src/http_client.rs'
          src = open(p).read()
          m = re.search(
              r'(impl CustomDnsResolver \{\n\s*fn new\(\) -> Arc<Self> \{\n)(\s*)', src)
          if m:
              indent = m.group(2)
              guard = (indent +
                  '// Hickory butuh konteks JNI Android (ndk-context) untuk baca DNS\n' +
                  indent + '// sistem; proses standalone tidak punya JavaVM -> panic saat\n' +
                  indent + '// request keluar (mis. ikon vault). Pakai DNS sistem default.\n' +
                  indent + 'if cfg!(target_os = "android") {\n' +
                  indent + '    return Arc::new(Self::Default());\n' +
                  indent + '}\n')
              # Jangan tulis dulu: patch TLS di bawah memakai variabel src yang sama.
              # Tulis sekali di akhir agar patch tidak saling menimpa.
              src = src[:m.end(1)] + guard + src[m.end(1):]
              print('Patch DNS Android diterapkan.')
          elif 'ndk-context' not in open('vaultwarden/Cargo.lock').read():
              print('ndk-context sudah tidak dipakai upstream; patch tidak perlu.')
          else:
              raise SystemExit('Anchor patch tidak ditemukan tapi ndk-context masih dipakai!')

          # Patch TLS verifier Android: rustls-platform-verifier (bawaan reqwest)
          # wajib di-init dari JavaVM; proses standalone tak punya JVM sehingga
          # tiap HTTPS keluar (ikon vault) panic 'to be initialized' -> 500.
          # Di Android pakai bundel root Mozilla + verifier webpki murni.
          old_builder = ('    Client::builder()\n'
              '        .default_headers(headers)\n'
              '        .redirect(redirect_policy)\n'
              '        .dns_resolver(CustomDns::instance(enforce_block))\n'
              '        .timeout(Duration::from_secs(10))\n'
              '}')
          new_builder = ('    let mut builder = Client::builder()\n'
              '        .default_headers(headers)\n'
              '        .redirect(redirect_policy)\n'
              '        .dns_resolver(CustomDns::instance(enforce_block))\n'
              '        .timeout(Duration::from_secs(10));\n'
              '    // rustls-platform-verifier (bawaan reqwest) wajib di-init dari JavaVM\n'
              '    // Android; proses standalone tak punya JVM sehingga tiap HTTPS keluar\n'
              '    // (mis. ikon vault) panic. Di Android pakai bundel root Mozilla + verifier\n'
              '    // webpki murni.\n'
              '    if cfg!(target_os = "android") {\n'
              '        builder = builder.tls_certs_only(mozilla_roots());\n'
              '    }\n'
              '    builder\n'
              '}\n'
              '\n'
              '/// Akar CA Mozilla (dibundel saat build CI) untuk verifier webpki di Android.\n'
              'fn mozilla_roots() -> Vec<reqwest::Certificate> {\n'
              '    const BUNDLE: &str = include_str!("../mozilla-cacert.pem");\n'
              '    match reqwest::Certificate::from_pem_bundle(BUNDLE.as_bytes()) {\n'
              '        Ok(certs) => certs,\n'
              '        Err(e) => {\n'
              '            warn!("Bundel CA Mozilla rusak, TLS keluar akan gagal: {e:?}");\n'
              '            Vec::new()\n'
              '        }\n'
              '    }\n'
              '}')
          if old_builder not in src:
              raise SystemExit('Anchor patch TLS tidak ditemukan, periksa http_client.rs upstream!')
          src = src.replace(old_builder, new_builder, 1)
          open(p, 'w').write(src)
          # Verifikasi kedua patch benar-benar ada di file hasil (anti saling menimpa).
          hasil = open(p).read()
          if 'ndk-context' in open('vaultwarden/Cargo.lock').read():
              assert 'return Arc::new(Self::Default());' in hasil, \
                  'Patch DNS hilang setelah patch TLS!'
          assert 'tls_certs_only(mozilla_roots())' in hasil, 'Patch TLS hilang!'
          print('Patch TLS Android diterapkan + verifikasi DNS/TLS OK.')
          PYEOF

      - name: Install pinned Vaultwarden toolchain with Android target
        run: |
          RUST_VERSION=$(grep -oP 'channel = "\K[^"]+' vaultwarden/rust-toolchain.toml)
          echo "Toolchain: $RUST_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target armv7-linux-androideabi

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            vaultwarden/target
            ~/.cargo/registry
          key: vw-cargo-armv7-${{ needs.resolve.outputs.vw }}
          # Prefiks lebar: cache versi lama masih dipakai untuk crate yang tak
          # berubah (cargo memvalidasi fingerprint). Dulu restore-key memakai
          # versi yang sama + "-" sehingga tak pernah cocok dengan key mana pun.
          restore-keys: |
            vw-cargo-armv7-

      - name: Cross-compile vaultwarden for Android (armv7)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/${{ env.NDK_VERSION }}"
          test -d "$NDK" || { echo "NDK not found at $NDK"; exit 1; }
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_armv7_linux_androideabi="$TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export AR_armv7_linux_androideabi="$TOOLCHAIN/llvm-ar"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$TOOLCHAIN/llvm-ar"
          TOOLCHAIN_BIN="$RUNNER_TEMP/toolchain-bin"
          mkdir -p "$TOOLCHAIN_BIN"
          for prefix in armv7-linux-androideabi armv7a-linux-androideabi; do
            ln -sf "$TOOLCHAIN/llvm-ar"      "$TOOLCHAIN_BIN/${prefix}-ar"
            ln -sf "$TOOLCHAIN/llvm-ranlib"  "$TOOLCHAIN_BIN/${prefix}-ranlib"
            ln -sf "$TOOLCHAIN/llvm-nm"      "$TOOLCHAIN_BIN/${prefix}-nm"
            ln -sf "$TOOLCHAIN/llvm-strip"   "$TOOLCHAIN_BIN/${prefix}-strip"
            ln -sf "$TOOLCHAIN/llvm-objcopy" "$TOOLCHAIN_BIN/${prefix}-objcopy"
          done
          export PATH="$TOOLCHAIN_BIN:$PATH"
          cd vaultwarden
          RUST_VERSION=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN="$RUST_VERSION"
          # Profil ukuran: strip simbol + LTO + 1 codegen unit + optimasi ukuran.
          export CARGO_PROFILE_RELEASE_STRIP=true
          export CARGO_PROFILE_RELEASE_LTO=thin
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          # --locked: build wajib memakai Cargo.lock bawaan tag upstream apa
          # adanya. Tanpa ini cargo boleh menarik versi crate semver-terbaru
          # (build tak reprodusibel, dan crate baru bisa menuntut toolchain
          # lebih baru daripada rust-toolchain.toml tag tersebut).
          cargo build --release --locked --target armv7-linux-androideabi \
            --features sqlite,vendored_openssl
          BIN=target/armv7-linux-androideabi/release/vaultwarden
          ls -lh "$BIN"
          # Strip ganda demi keamanan (llvm-strip dari NDK).
          "$TOOLCHAIN/llvm-strip" -s "$BIN" || true
          mkdir -p ../app/src/main/assets/bin/armeabi-v7a
          cp "$BIN" ../app/src/main/assets/bin/armeabi-v7a/vaultwarden

      - name: Inspect binary
        run: |
          file app/src/main/assets/bin/armeabi-v7a/vaultwarden
          ls -lh app/src/main/assets/bin/armeabi-v7a/vaultwarden

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: vw-binary-armeabi-v7a
          path: app/src/main/assets/bin/armeabi-v7a/vaultwarden
          if-no-files-found: error

      - name: Compile shim getrandom (API 21, armv7)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLCHAIN="$SDK/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/armv7a-linux-androideabi21-clang" -shared -fPIC -Os \
            -o libgetrandom-shim-armeabi-v7a.so shim/getrandom_shim.c
          "$TOOLCHAIN/llvm-strip" -s libgetrandom-shim-armeabi-v7a.so || true
          file libgetrandom-shim-armeabi-v7a.so
          ls -lh libgetrandom-shim-armeabi-v7a.so

      - name: Uji interposisi shim (host)
        run: |
          gcc -shared -fPIC -Os -o /tmp/libshim-host.so shim/getrandom_shim.c
          gcc -Os -o /tmp/test_interpose shim/test_interpose.c
          echo "--- tanpa shim (wajar gagal/EINVAL) ---"
          /tmp/test_interpose || true
          echo "--- dengan LD_PRELOAD shim (wajib OK) ---"
          LD_PRELOAD=/tmp/libshim-host.so /tmp/test_interpose

      - name: Upload shim artifact
        uses: actions/upload-artifact@v7
        with:
          name: vw-shim
          path: libgetrandom-shim-armeabi-v7a.so
          if-no-files-found: error

  publish-binary:
    name: Publish binary & web-vault
    needs: [resolve, build-binary]
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-24.04
    # Satu-satunya job yang menulis rilis (buat rilis + unggah 6 aset).
    permissions:
      contents: write
    env:
      VW: ${{ needs.resolve.outputs.vw }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download binary hasil build
        uses: actions/download-artifact@v7
        with:
          name: vw-binary-armeabi-v7a
          path: /tmp/baru-bin

      - name: Download shim hasil build
        uses: actions/download-artifact@v7
        with:
          name: vw-shim
          path: /tmp/baru-shim

      - name: Siapkan & publish 6 asset non-APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Wajib: langkah ini cd ke /tmp/pub (di luar repo git) sehingga
          # gh tak bisa menebak owner/repo dari remote — pin eksplisit.
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="v$VW"
          mkdir -p /tmp/pub
          cd /tmp/pub
          # Binary + shim selalu hasil build baru dari job di atas.
          cp /tmp/baru-bin/vaultwarden vaultwarden-armeabi-v7a
          cp /tmp/baru-shim/libgetrandom-shim-armeabi-v7a.so libgetrandom-shim-armeabi-v7a.so
          # Web-vault hanya tergantung versi upstream: pakai ulang dari rilis
          # bila sudah ada (hemat Docker + kuota pada push shim-only).
          # Digest web-vault untuk tag ini dibaca LEBIH DULU dan dipakai sebagai
          # pengikat versi zip yang dipakai ulang: dulu cuma `unzip -t` (integritas),
          # sehingga zip dari digest lain untuk tag yang sama tetap diterima dan
          # isinya bisa web-vault versi berbeda dengan binary yang dirilis.
          # Tanpa `head -n 1` di ujung pipa: head keluar lebih dulu sehingga
          # grep kena SIGPIPE (141) dan pipefail menggagalkan langkah ini acak.
          DIGEST=$(curl -fsSL --retry 3 --retry-delay 5 "https://raw.githubusercontent.com/dani-garcia/vaultwarden/$VW/docker/DockerSettings.yaml" \
            | grep 'vault_image_digest' \
            | sed -nE '1{s/.*"(sha256:[a-f0-9]+)".*/\1/;p;}')
          # Format ketat: saring keluaran multi-baris/sampah bila format
          # upstream berubah (multi-arch) agar gagal lantang di sini, bukan
          # di docker create di tengah publish.
          case "$DIGEST" in sha256:*) ;; *) echo "Digest web-vault tidak valid: $DIGEST"; exit 1;; esac
          echo "Web-vault digest: $DIGEST"
          PAKAI_ULANG=0
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -x "web-vault.zip" >/dev/null; then
            echo "web-vault.zip sudah ada di $TAG — unduh untuk dicek ulang."
            if gh release download "$TAG" -p "web-vault.zip" -O web-vault.zip \
                && unzip -tq web-vault.zip >/dev/null 2>&1 \
                && [ "$(unzip -p web-vault.zip .vaultwarden-web-digest 2>/dev/null || true)" = "$DIGEST" ]; then
              PAKAI_ULANG=1
            else
              echo "::warning::web-vault.zip di $TAG korup atau beda digest — dibangun ulang dari digest Docker."
              rm -f web-vault.zip
            fi
          fi
          if [ "$PAKAI_ULANG" -eq 0 ]; then
            docker create --name vwweb "vaultwarden/web-vault@$DIGEST"
            docker cp vwweb:/web-vault /tmp/web-vault
            docker rm vwweb
            # Penanda pengikat versi di dalam zip (dibaca cek pemakaian ulang di
            # atas): zip lama tanpa penanda otomatis dibangun ulang sekali.
            (cd /tmp/web-vault && printf '%s\n' "$DIGEST" > .vaultwarden-web-digest \
              && zip -qr /tmp/pub/web-vault.zip .)
            ls -lh /tmp/pub/web-vault.zip
          fi
          # Verifikasi isi web-vault SEBELUM diunggah, termasuk zip yang
          # dipakai ulang dari rilis lama: `unzip -t` mendeteksi entri
          # korup/terpotong, index.html wajib ada di akar (app menolak
          # web-vault tanpa index.html dan menjawab 404), dan ukuran minimum
          # menyaring zip kosong. Dulu yang diperiksa hanya .sha256 yang kita
          # buat sendiri — sirkular, isi zip tak pernah disentuh.
          if ! unzip -tq web-vault.zip >/dev/null 2>&1; then
            echo "::error::web-vault.zip korup (unzip -t gagal)"; exit 1
          fi
          if ! unzip -Z1 web-vault.zip | grep -x "index.html" >/dev/null; then
            echo "::error::web-vault.zip tidak berisi index.html di akar"; exit 1
          fi
          WV_SIZE=$(stat -c%s web-vault.zip)
          if [ "$WV_SIZE" -lt 1048576 ]; then
            echo "::error::web-vault.zip terlalu kecil ($WV_SIZE byte) - kemungkinan terpotong"; exit 1
          fi
          echo "web-vault.zip lolos cek isi ($WV_SIZE byte, index.html ada)."
          sha256sum vaultwarden-armeabi-v7a > vaultwarden-armeabi-v7a.sha256
          sha256sum libgetrandom-shim-armeabi-v7a.so > libgetrandom-shim-armeabi-v7a.so.sha256
          sha256sum web-vault.zip > web-vault.zip.sha256
          ls -lh vaultwarden-armeabi-v7a libgetrandom-shim-armeabi-v7a.so web-vault.zip
          # Buat rilis bila belum ada (upload APK menyusul via workflow APK;
          # '|| true' agar tak gagal bila workflow APK membuatnya bersamaan).
          # --latest=false: penanda latest baru dipasang di akhir setelah 6
          # aset non-APK terbukti ada. Rilis setengah jadi (mis. unggahan
          # gagal di tengah) tak boleh jadi tujuan /releases/latest/download
          # yang dipakai app untuk fallback unduhan.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --latest=false \
              --title "Tasirin Vaultwarden Host $VW (Android)" \
              --notes "APK armv7 (32-bit ARM) ditandatangani keystore tasirin. Binary + shim getrandom (untuk STB kernel lama/Android 5-6) untuk update di dalam app. Web-vault.zip untuk update web vault." || true
          gh release view "$TAG" >/dev/null 2>&1
          unggah_asset() {
            berkas="$1"
            percobaan=1
            while [ "$percobaan" -le 6 ]; do
              # --clobber: timpa asset bernama sama tanpa perlu mencari ID dan
              # menghapus manual lebih dulu (dulu: hapus per ID + tidur 5 dtk,
              # lalu "already exists" ditunggu 15 dtk x 6). gh melakukan
              # hapus+unggah berurutan dalam satu perintah, jadi jendela asset
              # hilang sesingkat mungkin.
              if gh release upload "$TAG" "$berkas" --clobber 2>"$berkas.gagal.log"; then
                rm -f "$berkas.gagal.log"
                return 0
              fi
              cat "$berkas.gagal.log"
              if ! grep -Eqi "already exists|validation failed|502|503|504|timed? ?out|EOF|connection reset" "$berkas.gagal.log"; then
                return 1
              fi
              echo "percobaan $percobaan: unggah $berkas gagal sementara, tunggu 15 dtk..."
              sleep 15
              percobaan=$((percobaan + 1))
            done
            return 1
          }
          for a in vaultwarden-armeabi-v7a vaultwarden-armeabi-v7a.sha256 \
              libgetrandom-shim-armeabi-v7a.so libgetrandom-shim-armeabi-v7a.so.sha256 \
              web-vault.zip web-vault.zip.sha256; do
            unggah_asset "$a"
          done
          # Verifikasi: 6 asset non-APK wajib ada (APK diterbitkan workflow APK).
          # Daftar asset API kadang basi sesaat setelah unggah, jadi coba ulang.
          # Selain nama, ukuran + digest SHA-256 (dihitung server GitHub) tiap
          # payload dibandingkan dengan berkas lokal, dan isi .sha256 dicek:
          # unggahan terpotong/diam-diam memakai asset lama tak boleh lolos
          # lalu ditandai "latest".
          PAYLOAD="vaultwarden-armeabi-v7a libgetrandom-shim-armeabi-v7a.so web-vault.zip"
          OK=false
          for t in 1 2 3; do
            OK=true
            # `|| true`: gh bisa gagal sesaat (502/rate-limit/timeout) tepat
            # setelah unggah. Tanpa ini `set -e` mematikan seluruh langkah,
            # sehingga loop coba-ulang 3x tak pernah berjalan dan aset yang
            # sebenarnya sudah lengkap tetap menggagalkan rilis.
            DAFTAR=$(gh release view "$TAG" --json assets -q '.assets[].name' || true)
            for a in vaultwarden-armeabi-v7a vaultwarden-armeabi-v7a.sha256 \
                libgetrandom-shim-armeabi-v7a.so libgetrandom-shim-armeabi-v7a.so.sha256 \
                web-vault.zip web-vault.zip.sha256; do
              echo "$DAFTAR" | grep -x "$a" >/dev/null || OK=false
            done
            for a in $PAYLOAD; do
              JAUH=$(gh release view "$TAG" --json assets \
                -q ".assets[] | select(.name==\"$a\") | .size" || true)
              LOKAL=$(stat -c%s "$a" || echo "")
              if [ "$JAUH" != "$LOKAL" ]; then
                echo "::error::Ukuran $a di rilis ($JAUH) != lokal ($LOKAL)"
                OK=false
              fi
              # Digest dihitung server GitHub saat unggah: bukti payload di
              # rilis benar-benar sama dengan berkas lokal. Membandingkan
              # .sha256 saja sirkular karena sidecar itu juga kita yang buat.
              JAUH_DIGEST=$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
                --jq ".assets[] | select(.name==\"$a\") | .digest // \"\"" || true)
              LOKAL_DIGEST="sha256:$(sha256sum "$a" | cut -d' ' -f1)"
              if [ -z "$JAUH_DIGEST" ]; then
                echo "::error::Digest SHA-256 $a tak tersedia di rilis"
                OK=false
              elif [ "$JAUH_DIGEST" != "$LOKAL_DIGEST" ]; then
                echo "::error::Digest $a di rilis ($JAUH_DIGEST) != lokal ($LOKAL_DIGEST)"
                OK=false
              fi
              rm -f /tmp/cek.sha256
              if ! gh release download "$TAG" -p "$a.sha256" -O /tmp/cek.sha256 2>/dev/null \
                  || ! cmp -s /tmp/cek.sha256 "$a.sha256"; then
                echo "::error::Isi $a.sha256 di rilis tidak sama dengan checksum lokal"
                OK=false
              fi
            done
            echo "Cek 6 asset non-APK di $TAG: $OK (cek $t/3)"
            [ "$OK" = true ] && break
            sleep 10
          done
          [ "$OK" = true ]
          # Baru sekarang rilis ini layak jadi "latest": 6 aset non-APK sudah
          # lengkap, sehingga /releases/latest/download/... (jalur fallback
          # app) pasti menemukan berkasnya. Gagal menandai bukan alasan
          # menggagalkan rilis (aset sudah benar); cukup dilaporkan.
          gh release edit "$TAG" --latest || \
            echo "::warning::Gagal menandai $TAG sebagai latest (aset tetap lengkap)."
