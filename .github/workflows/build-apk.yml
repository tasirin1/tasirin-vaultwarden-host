name: Build Vaultwarden Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VW_VERSION: 1.37.1
  VW_RUST_VERSION: 1.97.1
  NDK_VERSION: 25.2.9519653

jobs:
  build-binary:
    name: Build vaultwarden (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
          - abi: x86_64
            rust_target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Vaultwarden toolchain with Android target
        run: |
          rustup toolchain install ${{ env.VW_RUST_VERSION }} --profile minimal \
            --target ${{ matrix.rust_target }}

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2

      - name: Fetch Vaultwarden source
        run: |
          git clone --depth 1 --branch ${{ env.VW_VERSION }} \
            https://github.com/dani-garcia/vaultwarden.git

      - name: Cross-compile vaultwarden for Android
        run: |
          cd vaultwarden
          export RUSTUP_TOOLCHAIN=${{ env.VW_RUST_VERSION }}
          # -P = min Android API level (21 = Android 5.0). NDK dideteksi otomatis dari $ANDROID_HOME/ndk.
          cargo ndk -t ${{ matrix.abi }} -P 21 \
            -o ../app/src/main/assets/bin \
            build --release --features sqlite,vendored_openssl

      - name: Inspect binary
        run: |
          file app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden
          ls -lh app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vw-binary-${{ matrix.abi }}
          path: app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden
          if-no-files-found: error

  build-apk:
    name: Assemble APK
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-arm64-v8a
          path: app/src/main/assets/bin/arm64-v8a

      - name: Download binaries (armeabi-v7a)
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-armeabi-v7a
          path: app/src/main/assets/bin/armeabi-v7a

      - name: Download binaries (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-x86_64
          path: app/src/main/assets/bin/x86_64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check binaries
        run: |
          file app/src/main/assets/bin/*/vaultwarden
          ls -lhR app/src/main/assets/bin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/bin|classes.dex|AndroidManifest'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
