name: Build Tasirin Vaultwarden Host APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # Auto-rebuild beberapa jam setelah Vaultwarden rilis versi baru
  schedule:
    - cron: '0 */6 * * *' 

permissions:
  contents: write

# Satu rilis (satu tag) hanya dikerjakan satu run - cegah dua push
# berdekatan saling hapus/buat ulang rilis yang sama (pemicu 404 sesaat).
concurrency:
  group: vw-release
  cancel-in-progress: false

env:
  NDK_VERSION: 25.2.9519653

jobs:
  resolve:
    name: Resolve latest Vaultwarden
    runs-on: ubuntu-24.04
    outputs:
      vw: ${{ steps.vw.outputs.tag }}
      skip: ${{ steps.vw.outputs.skip }}
    steps:
      - id: vw
        run: |
          TAG=$(gh api repos/dani-garcia/vaultwarden/releases/latest --jq .tag_name 2>/dev/null \
            || curl -sf --retry 3 --retry-delay 5 https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r .tag_name)
          test -n "$TAG" || { echo "Gagal ambil versi Vaultwarden terbaru"; exit 1; }
          echo "Latest Vaultwarden: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXISTING=$(gh api "repos/tasirin1/tasirin-vaultwarden-host/releases/tags/v$TAG" --jq .tag_name 2>/dev/null || true)
            if [ "$EXISTING" = "v$TAG" ]; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-binary:
    name: Build vaultwarden (armeabi-v7a)
    needs: resolve
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Fetch Vaultwarden source (${{ needs.resolve.outputs.vw }})
        run: |
          git clone --depth 1 --branch ${{ needs.resolve.outputs.vw }} \
            https://github.com/dani-garcia/vaultwarden.git

      - name: Unduh bundel CA Mozilla (verifier TLS Android)
        run: |
          curl -fsSL --retry 3 https://curl.se/ca/cacert.pem \
            -o vaultwarden/mozilla-cacert.pem
          grep -q "BEGIN CERTIFICATE" vaultwarden/mozilla-cacert.pem

      - name: Patch DNS resolver untuk Android (tanpa ndk-context)
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'vaultwarden/src/http_client.rs'
          src = open(p).read()
          m = re.search(
              r'(impl CustomDnsResolver \{\n\s*fn new\(\) -> Arc<Self> \{\n)(\s*)', src)
          if m:
              indent = m.group(2)
              guard = (indent +
                  '// Hickory butuh konteks JNI Android (ndk-context) untuk baca DNS\n' +
                  indent + '// sistem; proses standalone tidak punya JavaVM -> panic saat\n' +
                  indent + '// request keluar (mis. ikon vault). Pakai DNS sistem default.\n' +
                  indent + 'if cfg!(target_os = "android") {\n' +
                  indent + '    return Arc::new(Self::Default());\n' +
                  indent + '}\n')
              open(p, 'w').write(src[:m.end(1)] + guard + src[m.end(1):])
              print('Patch DNS Android diterapkan.')
          elif 'ndk-context' not in open('vaultwarden/Cargo.lock').read():
              print('ndk-context sudah tidak dipakai upstream; patch tidak perlu.')
          else:
              raise SystemExit('Anchor patch tidak ditemukan tapi ndk-context masih dipakai!')

          # Patch TLS verifier Android: rustls-platform-verifier (bawaan reqwest)
          # wajib di-init dari JavaVM; proses standalone tak punya JVM sehingga
          # tiap HTTPS keluar (ikon vault) panic 'to be initialized' -> 500.
          # Di Android pakai bundel root Mozilla + verifier webpki murni.
          old_builder = ('    Client::builder()\n'
              '        .default_headers(headers)\n'
              '        .redirect(redirect_policy)\n'
              '        .dns_resolver(CustomDns::instance(enforce_block))\n'
              '        .timeout(Duration::from_secs(10))\n'
              '}')
          new_builder = ('    let mut builder = Client::builder()\n'
              '        .default_headers(headers)\n'
              '        .redirect(redirect_policy)\n'
              '        .dns_resolver(CustomDns::instance(enforce_block))\n'
              '        .timeout(Duration::from_secs(10));\n'
              '    // rustls-platform-verifier (bawaan reqwest) wajib di-init dari JavaVM\n'
              '    // Android; proses standalone tak punya JVM sehingga tiap HTTPS keluar\n'
              '    // (mis. ikon vault) panic. Di Android pakai bundel root Mozilla + verifier\n'
              '    // webpki murni.\n'
              '    if cfg!(target_os = "android") {\n'
              '        builder = builder.tls_certs_only(mozilla_roots());\n'
              '    }\n'
              '    builder\n'
              '}\n'
              '\n'
              '/// Akar CA Mozilla (dibundel saat build CI) untuk verifier webpki di Android.\n'
              'fn mozilla_roots() -> Vec<reqwest::Certificate> {\n'
              '    const BUNDLE: &str = include_str!("../mozilla-cacert.pem");\n'
              '    match reqwest::Certificate::from_pem_bundle(BUNDLE.as_bytes()) {\n'
              '        Ok(certs) => certs,\n'
              '        Err(e) => {\n'
              '            warn!("Bundel CA Mozilla rusak, TLS keluar akan gagal: {e:?}");\n'
              '            Vec::new()\n'
              '        }\n'
              '    }\n'
              '}')
          if old_builder not in src:
              raise SystemExit('Anchor patch TLS tidak ditemukan, periksa http_client.rs upstream!')
          src = src.replace(old_builder, new_builder, 1)
          open(p, 'w').write(src)
          print('Patch TLS Android diterapkan.')
          PYEOF



      - name: Install pinned Vaultwarden toolchain with Android target
        run: |
          RUST_VERSION=$(grep -oP 'channel = "\K[^"]+' vaultwarden/rust-toolchain.toml)
          echo "Toolchain: $RUST_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target armv7-linux-androideabi

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            vaultwarden/target
            ~/.cargo/registry
          key: vw-cargo-armv7-${{ needs.resolve.outputs.vw }}
          restore-keys: |
            vw-cargo-armv7-${{ needs.resolve.outputs.vw }}-

      - name: Cross-compile vaultwarden for Android (armv7)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/${{ env.NDK_VERSION }}"
          test -d "$NDK" || { echo "NDK not found at $NDK"; exit 1; }
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_armv7_linux_androideabi="$TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export AR_armv7_linux_androideabi="$TOOLCHAIN/llvm-ar"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$TOOLCHAIN/llvm-ar"
          TOOLCHAIN_BIN="$RUNNER_TEMP/toolchain-bin"
          mkdir -p "$TOOLCHAIN_BIN"
          for prefix in armv7-linux-androideabi armv7a-linux-androideabi; do
            ln -sf "$TOOLCHAIN/llvm-ar"      "$TOOLCHAIN_BIN/${prefix}-ar"
            ln -sf "$TOOLCHAIN/llvm-ranlib"  "$TOOLCHAIN_BIN/${prefix}-ranlib"
            ln -sf "$TOOLCHAIN/llvm-nm"      "$TOOLCHAIN_BIN/${prefix}-nm"
            ln -sf "$TOOLCHAIN/llvm-strip"   "$TOOLCHAIN_BIN/${prefix}-strip"
            ln -sf "$TOOLCHAIN/llvm-objcopy" "$TOOLCHAIN_BIN/${prefix}-objcopy"
          done
          export PATH="$TOOLCHAIN_BIN:$PATH"
          cd vaultwarden
          RUST_VERSION=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN="$RUST_VERSION"
          # Profil ukuran: strip simbol + LTO + 1 codegen unit + optimasi ukuran.
          export CARGO_PROFILE_RELEASE_STRIP=true
          export CARGO_PROFILE_RELEASE_LTO=thin
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=s
          cargo build --release --target armv7-linux-androideabi \
            --features sqlite,vendored_openssl
          BIN=target/armv7-linux-androideabi/release/vaultwarden
          ls -lh "$BIN"
          # Strip ganda demi keamanan (llvm-strip dari NDK).
          "$TOOLCHAIN/llvm-strip" -s "$BIN" || true
          mkdir -p ../app/src/main/assets/bin/armeabi-v7a
          cp "$BIN" ../app/src/main/assets/bin/armeabi-v7a/vaultwarden

      - name: Inspect binary
        run: |
          file app/src/main/assets/bin/armeabi-v7a/vaultwarden
          ls -lh app/src/main/assets/bin/armeabi-v7a/vaultwarden

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: vw-binary-armeabi-v7a
          path: app/src/main/assets/bin/armeabi-v7a/vaultwarden
          if-no-files-found: error

  build-shim:
    name: Build shim getrandom (armeabi-v7a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Compile shim getrandom (API 21, armv7)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLCHAIN="$SDK/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/armv7a-linux-androideabi21-clang" -shared -fPIC -Os \
            -o libgetrandom-shim-armeabi-v7a.so shim/getrandom_shim.c
          "$TOOLCHAIN/llvm-strip" -s libgetrandom-shim-armeabi-v7a.so || true
          file libgetrandom-shim-armeabi-v7a.so
          ls -lh libgetrandom-shim-armeabi-v7a.so

      - name: Uji interposisi shim (host)
        run: |
          gcc -shared -fPIC -Os -o /tmp/libshim-host.so shim/getrandom_shim.c
          gcc -Os -o /tmp/test_interpose shim/test_interpose.c
          echo "--- tanpa shim (wajar gagal/EINVAL) ---"
          /tmp/test_interpose || true
          echo "--- dengan LD_PRELOAD shim (wajib OK) ---"
          LD_PRELOAD=/tmp/libshim-host.so /tmp/test_interpose

      - name: Upload shim artifact
        uses: actions/upload-artifact@v7
        with:
          name: vw-shim
          path: libgetrandom-shim-armeabi-v7a.so
          if-no-files-found: error

  build-apk:
    name: Assemble APK
    needs: [build-binary, build-shim, resolve]
    if: needs.resolve.outputs.skip != 'yes'
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Download binary (armeabi-v7a)
        uses: actions/download-artifact@v7
        with:
          name: vw-binary-armeabi-v7a
          path: /tmp/vw-bin

      - name: Download shim getrandom
        uses: actions/download-artifact@v7
        with:
          name: vw-shim
          path: /tmp/vw-shim

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check binary
        run: |
          file /tmp/vw-bin/vaultwarden
          ls -lh /tmp/vw-bin/vaultwarden
          file /tmp/vw-shim/libgetrandom-shim-armeabi-v7a.so
          ls -lh /tmp/vw-shim/libgetrandom-shim-armeabi-v7a.so

      - name: Fetch web-vault (matching Vaultwarden version)
        run: |
          DIGEST=$(curl -s "https://raw.githubusercontent.com/dani-garcia/vaultwarden/${{ needs.resolve.outputs.vw }}/docker/DockerSettings.yaml" \
            | grep 'vault_image_digest' | sed -E 's/.*"(sha256:[a-f0-9]+)".*/\1/')
          test -n "$DIGEST" || { echo "Digest web-vault tidak ditemukan"; exit 1; }
          echo "Web-vault digest: $DIGEST"
          docker create --name vwweb "vaultwarden/web-vault@$DIGEST"
          docker cp vwweb:/web-vault /tmp/web-vault
          docker rm vwweb
          (cd /tmp/web-vault && zip -qr /tmp/web-vault.zip .)
          ls -lh /tmp/web-vault.zip

      - name: Write bundled version
        run: |
          mkdir -p app/src/main/assets
          echo "${{ needs.resolve.outputs.vw }}" > app/src/main/assets/vw_version.txt
          echo "Bundled Vaultwarden: $(cat app/src/main/assets/vw_version.txt)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK (armv7)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Lint & unit test
        run: |
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Tampilkan laporan lint di log
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || true

      - name: Build signed release APK (jika secret signing tersedia)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew --no-daemon :app:assembleRelease \
            -PstoreFile=keystore.jks \
            -PstorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name '*.apk' | head -1); fi
          echo "== $APK"
          unzip -l "$APK" | grep -E 'vw_version|classes.dex|AndroidManifest'
          ls -lh "$APK"

      - name: Cek ukuran APK (jaga APK tetap kecil)
        run: |
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name '*.apk' | head -1); fi
          SIZE=$(stat -c %s "$APK")
          echo "Ukuran APK (${APK##*/}): $SIZE bytes"
          # APK desain ~0,1 MB (binary & web-vault tidak dibundel); batas 2 MB
          # agar membengkaknya APK langsung ketahuan di CI.
          if [ "$SIZE" -gt 2097152 ]; then
            echo "::error::APK terlalu besar: $SIZE > 2097152 bytes"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name '*.apk' | head -1); fi
          cp "$APK" tasirin-vaultwarden-host-armeabi-v7a.apk
          cp /tmp/vw-bin/vaultwarden vaultwarden-armeabi-v7a
          cp /tmp/vw-shim/libgetrandom-shim-armeabi-v7a.so libgetrandom-shim-armeabi-v7a.so
          cp /tmp/web-vault.zip web-vault.zip
          sha256sum vaultwarden-armeabi-v7a > vaultwarden-armeabi-v7a.sha256
          sha256sum libgetrandom-shim-armeabi-v7a.so > libgetrandom-shim-armeabi-v7a.so.sha256
          sha256sum web-vault.zip > web-vault.zip.sha256
          ls -lh tasirin-*.apk vaultwarden-armeabi-v7a libgetrandom-shim-armeabi-v7a.so web-vault.zip
          gh release delete "v${{ needs.resolve.outputs.vw }}" --yes --cleanup-tag || true
          gh release create "v${{ needs.resolve.outputs.vw }}" \
            tasirin-vaultwarden-host-armeabi-v7a.apk \
            vaultwarden-armeabi-v7a \
            vaultwarden-armeabi-v7a.sha256 \
            libgetrandom-shim-armeabi-v7a.so \
            libgetrandom-shim-armeabi-v7a.so.sha256 \
            web-vault.zip \
            web-vault.zip.sha256 \
            --title "Tasirin Vaultwarden Host ${{ needs.resolve.outputs.vw }} (Android)" \
            --notes "APK armv7 (32-bit ARM) ditandatangani keystore tasirin. Binary + shim getrandom (untuk STB kernel lama/Android 5-6) untuk update di dalam app. Web-vault.zip untuk update web vault."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasirin-vaultwarden-host-apk-armeabi-v7a
          path: tasirin-vaultwarden-host-armeabi-v7a.apk
          if-no-files-found: error
