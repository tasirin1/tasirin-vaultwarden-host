name: Build APK

on:
  push:
    branches: [ main ]

    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'tools/verifikasi-patch.py'
      - 'tools/uji-verifikasi.py'
      - 'tools/uji-cek-cepat.py'
      - 'scripts/cek-cepat.sh'
      - '.github/workflows/build-apk.yml'
      - '.github/actions/resolve-vw/**'
  pull_request:

    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'tools/verifikasi-patch.py'
      - 'tools/uji-verifikasi.py'
      - 'tools/uji-cek-cepat.py'
      - 'scripts/cek-cepat.sh'
      - '.github/workflows/build-apk.yml'
      - '.github/actions/resolve-vw/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vw-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifikasi:
    name: Cek patch yang berubah
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

          persist-credentials: false
      - name: Verifikasi patch (tanpa SDK Android)
        run: |

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RENTANG="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            RENTANG="${{ github.event.before }}...${{ github.sha }}"
          fi
          python3 tools/verifikasi-patch.py --rentang "$RENTANG"
      - name: Cek cepat (vektor 0.x, README, secret)
        run: bash scripts/cek-cepat.sh
      - name: Uji-diri gerbang (cabang langka verifikasi-patch)
        run: python3 tools/uji-verifikasi.py
      - name: Uji-diri cek-cepat (cabang deteksi cek-cepat)
        run: python3 tools/uji-cek-cepat.py

  resolve:
    name: Resolve latest Vaultwarden
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      vw: ${{ steps.ambil.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: ambil
        uses: ./.github/actions/resolve-vw

  build-apk:
    name: Assemble APK
    needs: [resolve, verifikasi]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: write
    env:
      VW: ${{ needs.resolve.outputs.vw }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Write bundled version
        run: |
          mkdir -p app/src/main/assets
          printf '%s\n' "$VW" > app/src/main/assets/vw_version.txt
          echo "Bundled Vaultwarden: $(cat app/src/main/assets/vw_version.txt)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Lint & unit test
        run: |
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Tampilkan laporan lint di log
        if: always()
        run: |

          for f in \
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt \
            app/build/reports/lint-results-debug.txt; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              sed -n '1,400p' "$f"
            fi
          done

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v kosong - APK release tidak boleh diterbitkan unsigned."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

          ./gradlew --no-daemon :app:assembleRelease \
            -PstoreFile=keystore.jks

      - name: Verify APK contents
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SIDIK_SERT: c2785a618082683755eeae867e0a2e01f450b1fd448859d1ec21cf854c5713d1
        run: |

          APK=$(find app/build/outputs/apk -name '*release*.apk' -print -quit)
          test -n "$APK" || { echo "::error::APK release tidak ada (signing gagal/dilewati?)"; exit 1; }
          echo "== $APK"
          case "$APK" in
            *unsigned*) echo "::error::APK release unsigned - jangan diterbitkan."; exit 1;;
          esac

          CETAK=$(keytool -printcert -jarfile "$APK" 2>/dev/null) || {
            echo "::error::APK release tidak bertanda tangan (keytool gagal baca sertifikat)."
            exit 1
          }
          SERT=$(printf '%s\n' "$CETAK" \
            | sed -n 's/.*SHA[-]*256:[[:space:]]*//p' \
            | head -1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SERT" ]; then
            echo "::error::Sidik jari SHA-256 sertifikat APK tidak terbaca."
            exit 1
          fi
          if [ "$SERT" != "$SIDIK_SERT" ]; then
            echo "::error::Sertifikat APK bukan kunci rilis (dapat: $SERT, harus: $SIDIK_SERT) - APK tidak diterbitkan."
            exit 1
          fi
          echo "Sidik jari sertifikat cocok: $SERT"
          ISI=$(unzip -l "$APK")
          for wajib in vw_version.txt classes.dex AndroidManifest.xml; do
            printf '%s\n' "$ISI" | grep -q "$wajib" || {
              echo "::error::Isi APK wajib hilang: $wajib"
              exit 1
            }
          done
          echo "Isi APK wajib lengkap: vw_version.txt, classes.dex, AndroidManifest.xml"
          ls -lh "$APK"

      - name: Cek ukuran APK (jaga APK tetap kecil)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |

          APK=$(find app/build/outputs/apk -name '*release*.apk' -print -quit)
          test -n "$APK" || { echo "::error::APK release tidak ada (signing gagal/dilewati?)"; exit 1; }
          SIZE=$(stat -c %s "$APK")
          echo "Ukuran APK (${APK##*/}): $SIZE bytes"

          if [ "$SIZE" -gt 2097152 ]; then
            echo "::error::APK terlalu besar: $SIZE > 2097152 bytes"
            exit 1
          fi

      - name: Publish APK ke rilis

        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          APK=$(find app/build/outputs/apk -name '*release*.apk' -print -quit)
          test -n "$APK" || { echo "::error::APK release tidak ada (signing gagal/dilewati?)"; exit 1; }
          cp "$APK" tasirin-vaultwarden-host-armeabi-v7a.apk
          ls -lh tasirin-*.apk
          TAG="v$VW"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --latest=false \
              --title "Tasirin Vaultwarden Host $VW (Android)" \
              --notes "APK armv7 (32-bit ARM) ditandatangani keystore tasirin. Binary + shim getrandom (untuk STB kernel lama/Android 5-6) untuk update di dalam app. Web-vault.zip untuk update web vault." || true
          gh release view "$TAG" >/dev/null 2>&1
          APK_NAME=tasirin-vaultwarden-host-armeabi-v7a.apk

          unggah_asset() {
            berkas="$1"
            percobaan=1
            while [ "$percobaan" -le 6 ]; do
              if gh release upload "$TAG" "$berkas" --clobber 2>"$berkas.gagal.log"; then
                rm -f "$berkas.gagal.log"
                return 0
              fi
              cat "$berkas.gagal.log"
              if ! grep -Eqi "already exists|validation failed|502|503|504|timed? ?out|EOF|connection reset" "$berkas.gagal.log"; then
                return 1
              fi
              echo "percobaan $percobaan: unggah $berkas gagal sementara, tunggu 15 dtk..."
              sleep 15
              percobaan=$((percobaan + 1))
            done
            return 1
          }
          if ! unggah_asset "$APK_NAME"; then
            echo "::error::Gagal mengunggah $APK_NAME"
            exit 1
          fi

          LOKAL=$(stat -c %s "$APK_NAME")
          OK=false
          for t in 1 2 3; do
            RILIS=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.assets[] | select(.name=="'"$APK_NAME"'") | .size' 2>/dev/null || true)
            if [ "$RILIS" = "$LOKAL" ]; then
              echo "APK terverifikasi di $TAG: $RILIS byte (cek $t/3)"
              OK=true
              break
            fi
            echo "Ukuran APK di rilis: ${RILIS:-belum ada} (lokal $LOKAL), cek $t/3"
            sleep 10
          done
          [ "$OK" = true ] || { echo "::error::APK di rilis tidak cocok dengan hasil build"; exit 1; }

          JAUH_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="'"$APK_NAME"'") | .digest // ""' 2>/dev/null || true)
          LOKAL_DIGEST="sha256:$(sha256sum "$APK_NAME" | cut -d' ' -f1)"
          if [ -z "$JAUH_DIGEST" ]; then
            echo "::error::Digest SHA-256 $APK_NAME tak tersedia di rilis"
            exit 1
          fi
          if [ "$JAUH_DIGEST" != "$LOKAL_DIGEST" ]; then
            echo "::error::Digest $APK_NAME di rilis ($JAUH_DIGEST) != lokal ($LOKAL_DIGEST)"
            exit 1
          fi
          echo "Digest APK terverifikasi di $TAG: $LOKAL_DIGEST"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tasirin-vaultwarden-host-apk-armeabi-v7a
          path: tasirin-vaultwarden-host-armeabi-v7a.apk
          if-no-files-found: error
