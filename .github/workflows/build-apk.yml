name: Build APK

on:
  push:
    branches: [ main ]
    # Commit dokumen + shim saja tak menyentuh APK: hemat satu build.
    # (Perubahan shim/patch-binary ditangani workflow Build Binary & Web-Vault.)
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'shim/**'
      - '.github/workflows/build-binary.yml'
  workflow_dispatch:
  # Ikut jalan saat workflow binary selesai: tag upstream baru butuh APK
  # pendamping (vw_version.txt ikut naik). Dilewati bila APK sudah ada.
  workflow_run:
    workflows: [Build Binary & Web-Vault]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Grup sendiri agar bisa jalan paralel dengan workflow binary (unggahan APK
# ke rilis yang sama idempoten: hapus duplikat per ID + coba ulang).
concurrency:
  group: vw-apk
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve latest Vaultwarden
    runs-on: ubuntu-24.04
    outputs:
      vw: ${{ steps.vw.outputs.tag }}
      skip: ${{ steps.vw.outputs.skip }}
      ada: ${{ steps.vw.outputs.ada }}
    steps:
      - id: vw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fallback curl membawa token (limit 5000/jam, bukan 60/jam anonim)
          # agar resolve tak gagal spurios saat cron + push berdekatan.
          HDR=()
          if [ -n "${GH_TOKEN:-}" ]; then HDR=(-H "Authorization: Bearer ${GH_TOKEN}"); fi
          TAG=$(gh api repos/dani-garcia/vaultwarden/releases/latest --jq '.tag_name // empty' 2>/dev/null \
            || curl -sf --retry 3 --retry-delay 5 "${HDR[@]}" https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r '.tag_name // empty')
          case "$TAG" in ""|null) echo "Gagal ambil versi Vaultwarden terbaru"; exit 1;; esac
          echo "Latest Vaultwarden: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh api "repos/tasirin1/tasirin-vaultwarden-host/releases/tags/v$TAG" --jq .tag_name 2>/dev/null || true)
          if [ "$EXISTING" = "v$TAG" ]; then
            echo "ada=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ada=no" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$EXISTING" = "v$TAG" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          fi

  perlu:
    name: Perlu bangun APK?
    needs: resolve
    runs-on: ubuntu-24.04
    outputs:
      ya: ${{ steps.c.outputs.ya }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push/manual: selalu bangun. workflow_run: hanya bila binary sukses
          # dan APK belum ada di rilis (tag upstream baru); bila APK sudah ada
          # (mis. push shim-only), lewati agar versionCode tak churn sia-sia.
          YA=yes
          ALASAN="pemicu ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              YA=no; ALASAN="workflow binary tidak sukses"
            elif gh release view "v${{ needs.resolve.outputs.vw }}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "tasirin-vaultwarden-host-armeabi-v7a.apk"; then
              YA=no; ALASAN="APK sudah ada di rilis"
            fi
          fi
          echo "bangun=$YA ($ALASAN)"
          echo "ya=$YA" >> "$GITHUB_OUTPUT"

  build-apk:
    name: Assemble APK
    needs: [resolve, perlu]
    if: needs.perlu.outputs.ya == 'yes'
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Write bundled version
        run: |
          mkdir -p app/src/main/assets
          echo "${{ needs.resolve.outputs.vw }}" > app/src/main/assets/vw_version.txt
          echo "Bundled Vaultwarden: $(cat app/src/main/assets/vw_version.txt)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK (armv7)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Lint & unit test
        run: |
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Tampilkan laporan lint di log
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || true

      - name: Build signed release APK (jika secret signing tersedia)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew --no-daemon :app:assembleRelease \
            -PstoreFile=keystore.jks \
            -PstorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$APK" || { echo "::error::APK release tidak ada (signing gagal/dilewati?)"; exit 1; }
          echo "== $APK"
          unzip -l "$APK" | grep -E 'vw_version|classes.dex|AndroidManifest'
          ls -lh "$APK"

      - name: Cek ukuran APK (jaga APK tetap kecil)
        run: |
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$APK" || { echo "::error::APK release tidak ada (signing gagal/dilewati?)"; exit 1; }
          SIZE=$(stat -c %s "$APK")
          echo "Ukuran APK (${APK##*/}): $SIZE bytes"
          # APK desain ~0,1 MB (binary & web-vault tidak dibundel); batas 2 MB
          # agar membengkaknya APK langsung ketahuan di CI.
          if [ "$SIZE" -gt 2097152 ]; then
            echo "::error::APK terlalu besar: $SIZE > 2097152 bytes"
            exit 1
          fi

      - name: Publish APK ke rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$APK" || { echo "::error::APK release tidak ada (signing gagal/dilewati?)"; exit 1; }
          cp "$APK" tasirin-vaultwarden-host-armeabi-v7a.apk
          ls -lh tasirin-*.apk
          TAG="v${{ needs.resolve.outputs.vw }}"
          # Buat rilis bila belum ada ('|| true' agar tak gagal bila workflow
          # binary membuatnya bersamaan); APK hanya menimpa asset APK.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Tasirin Vaultwarden Host ${{ needs.resolve.outputs.vw }} (Android)" \
              --notes "APK armv7 (32-bit ARM) ditandatangani keystore tasirin. Binary + shim getrandom (untuk STB kernel lama/Android 5-6) untuk update di dalam app. Web-vault.zip untuk update web vault." || true
          gh release view "$TAG" >/dev/null 2>&1
          unggah_asset() {
            berkas="$1"
            percobaan=1
            while [ "$percobaan" -le 6 ]; do
              for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                  --jq '.assets[] | select(.name=="'"$berkas"'") | .id' 2>/dev/null); do
                gh api -X DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null 2>&1 || true
              done
              sleep 5
              if gh release upload "$TAG" "$berkas" 2>"$berkas.gagal.log"; then
                rm -f "$berkas.gagal.log"
                return 0
              fi
              if ! grep -q "already exists" "$berkas.gagal.log"; then
                cat "$berkas.gagal.log"
                return 1
              fi
              echo "percobaan $percobaan: $berkas masih 'already exists', tunggu 15 dtk..."
              sleep 15
              percobaan=$((percobaan + 1))
            done
            cat "$berkas.gagal.log"
            return 1
          }
          unggah_asset tasirin-vaultwarden-host-armeabi-v7a.apk
          # Verifikasi: APK wajib ada di rilis (6 asset lain milik workflow binary).
          # Daftar asset API kadang basi sesaat setelah unggah, jadi coba ulang.
          for t in 1 2 3; do
            if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "tasirin-vaultwarden-host-armeabi-v7a.apk"; then
              echo "APK ada di $TAG (cek $t/3)"
              break
            fi
            sleep 10
          done
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "tasirin-vaultwarden-host-armeabi-v7a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasirin-vaultwarden-host-apk-armeabi-v7a
          path: tasirin-vaultwarden-host-armeabi-v7a.apk
          if-no-files-found: error
