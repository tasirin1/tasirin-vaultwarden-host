name: Build Vaultwarden Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VW_VERSION: 1.37.1
  VW_RUST_VERSION: 1.97.1
  NDK_VERSION: 25.2.9519653

jobs:
  build-binary:
    name: Build vaultwarden (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang: aarch64-linux-android21-clang
            cc_env: CC_aarch64_linux_android
            ar_cc_env: AR_aarch64_linux_android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            ar_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_AR
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi21-clang
            cc_env: CC_armv7_linux_androideabi
            ar_cc_env: AR_armv7_linux_androideabi
            linker_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
            ar_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR
          - abi: x86_64
            rust_target: x86_64-linux-android
            clang: x86_64-linux-android21-clang
            cc_env: CC_x86_64_linux_android
            ar_cc_env: AR_x86_64_linux_android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            ar_env: CARGO_TARGET_X86_64_LINUX_ANDROID_AR
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Vaultwarden toolchain with Android target
        run: |
          rustup toolchain install ${{ env.VW_RUST_VERSION }} --profile minimal \
            --target ${{ matrix.rust_target }}

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Fetch Vaultwarden source
        run: |
          git clone --depth 1 --branch ${{ env.VW_VERSION }} \
            https://github.com/dani-garcia/vaultwarden.git

      - name: Cross-compile vaultwarden for Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/${{ env.NDK_VERSION }}"
          test -d "$NDK" || { echo "NDK not found at $NDK"; exit 1; }
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Set compiler + linker dari NDK untuk target Android (API 21 = Android 5.0).
          # cargo-ndk 4.x tidak dipakai karena hanya menyalin hasil cdylib (.so).
          export "${{ matrix.cc_env }}=${TOOLCHAIN}/${{ matrix.clang }}"
          export "${{ matrix.ar_cc_env }}=${TOOLCHAIN}/llvm-ar"
          export AR="${TOOLCHAIN}/llvm-ar"
          export "${{ matrix.linker_env }}=${TOOLCHAIN}/${{ matrix.clang }}"
          export "${{ matrix.ar_env }}=${TOOLCHAIN}/llvm-ar"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cd vaultwarden
          export RUSTUP_TOOLCHAIN=${{ env.VW_RUST_VERSION }}
          cargo build --release --target ${{ matrix.rust_target }} \
            --features sqlite,vendored_openssl
          mkdir -p ../app/src/main/assets/bin/${{ matrix.abi }}
          cp target/${{ matrix.rust_target }}/release/vaultwarden \
            ../app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden

      - name: Inspect binary
        run: |
          file app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden
          ls -lh app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vw-binary-${{ matrix.abi }}
          path: app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden
          if-no-files-found: error

  build-apk:
    name: Assemble APK
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-arm64-v8a
          path: app/src/main/assets/bin/arm64-v8a

      - name: Download binaries (armeabi-v7a)
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-armeabi-v7a
          path: app/src/main/assets/bin/armeabi-v7a

      - name: Download binaries (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-x86_64
          path: app/src/main/assets/bin/x86_64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check binaries
        run: |
          file app/src/main/assets/bin/*/vaultwarden
          ls -lhR app/src/main/assets/bin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/bin|classes.dex|AndroidManifest'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
