name: Build Vaultwarden Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 25.2.9519653

jobs:
  resolve:
    name: Resolve latest Vaultwarden
    runs-on: ubuntu-latest
    outputs:
      vw: ${{ steps.vw.outputs.tag }}
    steps:
      - id: vw
        run: |
          TAG=$(curl -s https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r .tag_name)
          echo "Latest Vaultwarden: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-binary:
    name: Build vaultwarden (${{ matrix.abi }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang: aarch64-linux-android21-clang
            tool_prefixes: aarch64-linux-android
            cc_env: CC_aarch64_linux_android
            ar_cc_env: AR_aarch64_linux_android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            ar_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_AR
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi21-clang
            tool_prefixes: armv7-linux-androideabi armv7a-linux-androideabi
            cc_env: CC_armv7_linux_androideabi
            ar_cc_env: AR_armv7_linux_androideabi
            linker_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
            ar_env: CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR
          - abi: x86_64
            rust_target: x86_64-linux-android
            clang: x86_64-linux-android21-clang
            tool_prefixes: x86_64-linux-android
            cc_env: CC_x86_64_linux_android
            ar_cc_env: AR_x86_64_linux_android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            ar_env: CARGO_TARGET_X86_64_LINUX_ANDROID_AR
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Fetch Vaultwarden source (${{ needs.resolve.outputs.vw }})
        run: |
          git clone --depth 1 --branch ${{ needs.resolve.outputs.vw }} \
            https://github.com/dani-garcia/vaultwarden.git

      - name: Install pinned Vaultwarden toolchain with Android target
        run: |
          RUST_VERSION=$(grep -oP 'channel = "\K[^"]+' vaultwarden/rust-toolchain.toml)
          echo "Toolchain: $RUST_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target ${{ matrix.rust_target }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            vaultwarden/target
            ~/.cargo/registry
          key: vw-cargo-${{ matrix.abi }}-${{ needs.resolve.outputs.vw }}-${{ github.sha }}
          restore-keys: |
            vw-cargo-${{ matrix.abi }}-${{ needs.resolve.outputs.vw }}-

      - name: Cross-compile vaultwarden for Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK="$SDK/ndk/${{ env.NDK_VERSION }}"
          test -d "$NDK" || { echo "NDK not found at $NDK"; exit 1; }
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export "${{ matrix.cc_env }}=${TOOLCHAIN}/${{ matrix.clang }}"
          export "${{ matrix.ar_cc_env }}=${TOOLCHAIN}/llvm-ar"
          export AR="${TOOLCHAIN}/llvm-ar"
          export RANLIB="${TOOLCHAIN}/llvm-ranlib"
          export "${{ matrix.linker_env }}=${TOOLCHAIN}/${{ matrix.clang }}"
          export "${{ matrix.ar_env }}=${TOOLCHAIN}/llvm-ar"
          # NDK r25 tidak punya binary <triple>-ar / <triple>-ranlib (cuma llvm-*);
          # symlink ke llvm-* supaya openssl-src (make install_dev) tidak gagal.
          TOOLCHAIN_BIN="$RUNNER_TEMP/toolchain-bin"
          mkdir -p "$TOOLCHAIN_BIN"
          for prefix in ${{ matrix.tool_prefixes }}; do
            ln -sf "$TOOLCHAIN/llvm-ar"      "$TOOLCHAIN_BIN/${prefix}-ar"
            ln -sf "$TOOLCHAIN/llvm-ranlib"  "$TOOLCHAIN_BIN/${prefix}-ranlib"
            ln -sf "$TOOLCHAIN/llvm-nm"      "$TOOLCHAIN_BIN/${prefix}-nm"
            ln -sf "$TOOLCHAIN/llvm-strip"   "$TOOLCHAIN_BIN/${prefix}-strip"
            ln -sf "$TOOLCHAIN/llvm-objcopy" "$TOOLCHAIN_BIN/${prefix}-objcopy"
          done
          export PATH="$TOOLCHAIN_BIN:$PATH"
          cd vaultwarden
          RUST_VERSION=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)
          export RUSTUP_TOOLCHAIN="$RUST_VERSION"
          cargo build --release --target ${{ matrix.rust_target }} \
            --features sqlite,vendored_openssl
          mkdir -p ../app/src/main/assets/bin/${{ matrix.abi }}
          cp target/${{ matrix.rust_target }}/release/vaultwarden \
            ../app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden

      - name: Inspect binary
        run: |
          file app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden
          ls -lh app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vw-binary-${{ matrix.abi }}
          path: app/src/main/assets/bin/${{ matrix.abi }}/vaultwarden
          if-no-files-found: error

  build-apk:
    name: Assemble APK (split per ABI)
    needs: [build-binary, resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries (arm64-v8a)
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-arm64-v8a
          path: app/src/arm64/assets/bin/arm64-v8a

      - name: Download binaries (armeabi-v7a)
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-armeabi-v7a
          path: app/src/armv7/assets/bin/armeabi-v7a

      - name: Download binaries (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: vw-binary-x86_64
          path: app/src/x64/assets/bin/x86_64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check binaries
        run: |
          file app/src/*/assets/bin/*/vaultwarden
          ls -lhR app/src/arm64/assets/bin app/src/armv7/assets/bin app/src/x64/assets/bin

      - name: Fetch web-vault (matching Vaultwarden version)
        run: |
          # Web-vault di-pin per rilis Vaultwarden lewat digest di docker/DockerSettings.yaml
          DIGEST=$(curl -s "https://raw.githubusercontent.com/dani-garcia/vaultwarden/${{ needs.resolve.outputs.vw }}/docker/DockerSettings.yaml" \
            | grep 'vault_image_digest' | sed -E 's/.*"(sha256:[a-f0-9]+)".*/\1/')
          test -n "$DIGEST" || { echo "Digest web-vault tidak ditemukan"; exit 1; }
          echo "Web-vault digest: $DIGEST"
          docker create --name vwweb "vaultwarden/web-vault@$DIGEST"
          docker cp vwweb:/web-vault /tmp/web-vault
          docker rm vwweb
          mkdir -p app/src/main/assets
          (cd /tmp/web-vault && zip -qr /tmp/web-vault.zip .)
          cp /tmp/web-vault.zip app/src/main/assets/web-vault.zip
          ls -lh app/src/main/assets/web-vault.zip

      - name: Write bundled version
        run: |
          mkdir -p app/src/main/assets
          echo "${{ needs.resolve.outputs.vw }}" > app/src/main/assets/vw_version.txt
          echo "Bundled Vaultwarden: $(cat app/src/main/assets/vw_version.txt)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs (semua flavor)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contents
        run: |
          for apk in app/build/outputs/apk/*/debug/app-*-debug.apk; do
            echo "== $apk"
            unzip -l "$apk" | grep -E 'assets/bin|vw_version|web-vault.zip|classes.dex|AndroidManifest'
          done
          ls -lh app/build/outputs/apk/*/debug/*.apk

      - name: Stage release files
        run: |
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk vaultwarden-android-arm64-v8a.apk
          cp app/build/outputs/apk/armv7/debug/app-armv7-debug.apk vaultwarden-android-armeabi-v7a.apk
          cp app/build/outputs/apk/x64/debug/app-x64-debug.apk vaultwarden-android-x86_64.apk
          cp app/src/arm64/assets/bin/arm64-v8a/vaultwarden vaultwarden-arm64-v8a
          cp app/src/armv7/assets/bin/armeabi-v7a/vaultwarden vaultwarden-armeabi-v7a
          cp app/src/x64/assets/bin/x86_64/vaultwarden vaultwarden-x86_64
          ls -lh vaultwarden-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v${{ needs.resolve.outputs.vw }} --yes --cleanup-tag || true
          gh release create v${{ needs.resolve.outputs.vw }} \
            vaultwarden-android-arm64-v8a.apk \
            vaultwarden-android-armeabi-v7a.apk \
            vaultwarden-android-x86_64.apk \
            vaultwarden-arm64-v8a \
            vaultwarden-armeabi-v7a \
            vaultwarden-x86_64 \
            --title "Vaultwarden ${{ needs.resolve.outputs.vw }} (Android)" \
            --notes "APK per ABI: arm64-v8a (HP modern), armeabi-v7a (HP lama), x86_64 (emulator). Plus binary untuk update di dalam app."

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-android-apk-arm64-v8a
          path: vaultwarden-android-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-android-apk-armeabi-v7a
          path: vaultwarden-android-armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-android-apk-x86_64
          path: vaultwarden-android-x86_64.apk
          if-no-files-found: error
