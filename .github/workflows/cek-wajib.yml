name: Cek wajib PR

# Proteksi branch main mewajibkan check "Cek patch yang berubah", tetapi
# build-apk.yml mengabaikan path dokumen/.gitignore pada pull_request —
# PR yang hanya menyentuh berkas itu tak pernah menghasilkan check wajib
# dan merge normalnya buntu selamanya (Audit 638). Workflow ringan ini
# berjalan untuk SEMUA PR tanpa saringan path dan melaporkan check
# wajib itu dengan langkah-langkah cek yang asli, agar PR dokumen
# tetap bisa di-merge lewat jalur normal. Audit 2558: workflow ini
# juga berjalan pada push ke main yang HANYA menyentuh berkas
# workflow non-build (auto-merge/label-audit/labeler/stale/
# cek-wajib sendiri) atau tools/pasang-hook.sh - berkas-berkas itu
# tidak ada di daftar path build-apk.yml, jadi push langsung yang
# hanya menyentuh mereka dulu lolos tanpa satu pun gerbang berjalan
# (PR-nya selalu tercakup di sini). Job verifikasi build-apk
# bernama berbeda ("Cek patch yang berubah (build-apk)") sejak
# Audit 2526 — langkah-langkahnya dilewati di PR (Audit 2522),
# jadi ia tidak boleh melaporkan nama check wajib ini.

on:
  pull_request:
  # Audit 2558: push langsung ke main yang hanya menyentuh berkas
  # di daftar ini tidak memicu build-apk.yml sama sekali; gerbang
  # yang sama seperti PR kini berjalan untuk push semacam itu.
  # Audit 2582: codeql.yml dan gitleaks.yml ditambahkan - jaring
  # 2558 semula kurang 2 dari 8 berkas workflow, push yang hanya
  # menyentuh keduanya lolos tanpa gerbang sama sekali.
  # Audit 2635: .github/dependabot.yml ditambahkan - berkas itu
  # ada di paths-ignore codeql/gitleaks dan tak ada di paths
  # build-apk/build-binary, jadi push yang hanya menyentuhnya
  # tidak memicu workflow apa pun.
  push:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      # Audit 2649: .gitignore ditambahkan -
      # pola 2635 yang sama; sebelumnya push
      # yang hanya mengubahnya tak memicu
      # workflow apa pun walau isinya
      # menentukan berkas yang ikut ter-commit.
      - '.gitignore'
      - '.github/workflows/auto-merge.yml'
      - '.github/workflows/cek-wajib.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/gitleaks.yml'
      - '.github/workflows/label-audit.yml'
      - '.github/workflows/labeler.yml'
      - '.github/workflows/stale.yml'
      - 'tools/pasang-hook.sh'

permissions:
  contents: read

# Audit 1487: dorongan beruntun ke PR yang sama membatalkan run
# lama. Audit 2558: workflow ini kini juga berjalan pada push -
# pembatalan hanya untuk PR; run push yang tercancel akan
# meninggalkan push itu tanpa gerbang.
concurrency:
  group: vw-cek-wajib-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Audit 2581: pada push campuran (kode + berkas daftar
  # 2558 bersamaan - pola push maraton), build-apk.yml
  # menjalankan gerbang yang sama persis di job paralelnya;
  # menjalankan ulang seluruhnya secara serial di sini
  # membuang +-31 menit CI tanpa sinyal tambahan. Job
  # ringan ini memutuskan: gerbang penuh di sini hanya
  # bila SEMUA berkas push ada di daftar 2558 (di luar
  # itu build-apk yang menanggung). Keraguan apa pun
  # (diff gagal, daftar kosong) = lanjut (fail-safe).
  saring-push:
    name: Saring push campuran
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lanjut: ${{ steps.saring.outputs.lanjut }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: saring
        name: Putuskan gerbang penuh perlu berjalan di sini
        run: |
          LANJUT=true
          if BERKAS=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}" 2>/dev/null); then
            if [ -n "$BERKAS" ]; then
              while IFS= read -r b; do
                case "$b" in
                  .github/dependabot.yml|.gitignore|.github/workflows/auto-merge.yml|.github/workflows/cek-wajib.yml|.github/workflows/codeql.yml|.github/workflows/gitleaks.yml|.github/workflows/label-audit.yml|.github/workflows/labeler.yml|.github/workflows/stale.yml|tools/pasang-hook.sh) ;;
                  *) LANJUT=false ;;
                esac
              done <<EOF
          $BERKAS
          EOF
            fi
          fi
          echo "lanjut=$LANJUT" >> "$GITHUB_OUTPUT"
          echo "Push ini: lanjut gerbang penuh di cek-wajib = $LANJUT"

  verifikasi:
    name: Cek patch yang berubah
    needs: saring-push
    # Audit 2581: job saring dilewati pada PR (needs yang
    # dilewati menahan job ini tanpa always()); pada push,
    # gerbang penuh hanya bila saring memutuskan lanjut.
    if: always() && (github.event_name == 'pull_request' || needs.saring-push.outputs.lanjut == 'true')
    runs-on: ubuntu-24.04
    # Audit 1380: suite uji-diri kini berjalan +-19-25 menit;
    # batas lama 15 menit membunuh job di tengah suite.
    # Audit 2149: job ini menjalankan DUA suite serial -
    # komponen terukurnya 22:18 (uji-verifikasi, Audit
    # 1617) + melampaui 15 menit (uji-cek-cepat, Audit
    # 2074) dan keduanya terus tumbuh; margin di 45
    # menipis - batas dinaikkan ke 75.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verifikasi patch (tanpa SDK Android)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RENTANG="${{ github.event.before }}...${{ github.sha }}"
          else
            RENTANG="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          fi
          python3 tools/verifikasi-patch.py --rentang "$RENTANG"
      - name: Cek cepat (vektor 0.x, README, secret)
        run: bash scripts/cek-cepat.sh
      - name: Uji-diri gerbang (cabang langka verifikasi-patch)
        run: python3 tools/uji-verifikasi.py
      - name: Uji-diri cek-cepat (cabang deteksi cek-cepat)
        run: python3 tools/uji-cek-cepat-1.py
      # Audit 2557: skenario terbagi dua berkas titik-masuk;
      # check wajib PR tetap menjalankan seluruh 106 skenario
      # (paruh awal oleh langkah di atas, paruh akhir oleh langkah
      # berikut). Audit 2559: langkah di atas sebelumnya menjalankan
      # berkas utama utuh sehingga paruh akhir berjalan dua kali.
      - name: Uji-diri cek-cepat bagian 2 (paruh akhir skenario)
        run: python3 tools/uji-cek-cepat-2.py
