plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaultwarden.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vaultwarden.android'
        minSdk 21
        // targetSdk 28 sengaja: agar binary vaultwarden tetap bisa di-execute dari app data
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }

    flavorDimensions 'abi'
    productFlavors {
        armv7 { dimension 'abi' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
